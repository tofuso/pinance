<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinance</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 class="logo">Pinance</h1>
    <div class="import-buttons">
      <label class="btn">
        <span class="btn-full">銀行CSV読込</span>
        <span class="btn-short">銀行</span>
        <input type="file" id="bank-file-input" accept=".csv" hidden>
      </label>
      <label class="btn">
        <span class="btn-full">カードCSV読込</span>
        <span class="btn-short">カード</span>
        <input type="file" id="card-file-input" accept=".csv" hidden>
      </label>
    </div>
    <button id="settings-btn" class="btn btn-icon" title="データ管理">⚙</button>
  </header>

  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>データ管理</h2>
        <button id="modal-close-btn" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <section class="modal-section">
          <h3>銀行取引</h3>
          <div class="modal-row">
            <select id="bank-month-select" disabled>
              <option value="">（データなし）</option>
            </select>
            <button id="bank-delete-month-btn" class="btn btn-danger-outline" disabled>選択月を削除</button>
          </div>
          <div class="modal-row">
            <button id="bank-delete-all-btn" class="btn btn-danger">全件削除</button>
          </div>
        </section>
        <section class="modal-section">
          <h3>カード取引</h3>
          <div class="modal-row">
            <select id="card-month-select" disabled>
              <option value="">（データなし）</option>
            </select>
            <button id="card-delete-month-btn" class="btn btn-danger-outline" disabled>選択月を削除</button>
          </div>
          <div class="modal-row">
            <button id="card-delete-all-btn" class="btn btn-danger">全件削除</button>
          </div>
        </section>
        <section class="modal-section">
          <h3>AI自動分類設定</h3>
          <div class="modal-row modal-row-label">
            <label>プロバイダー</label>
            <select id="ai-provider-select">
              <option value="ollama">Ollama</option>
              <option value="claude">Claude API</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>
          <div class="modal-row modal-row-label">
            <label>モデル名</label>
            <input type="text" id="ai-model-input" placeholder="例: llama3.2">
          </div>
          <div class="modal-row modal-row-label">
            <label>ベースURL</label>
            <input type="text" id="ai-base-url-input" placeholder="例: http://localhost:11434">
          </div>
          <div class="modal-row modal-row-label">
            <label>APIキー</label>
            <input type="password" id="ai-api-key-input" placeholder="（Ollamaは不要）">
          </div>
          <div class="modal-row">
            <button id="ai-settings-save-btn" class="btn">保存</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="transactions">取引一覧</button>
    <button class="tab-btn" data-tab="analytics">分析</button>
    <button class="tab-btn" data-tab="categories">カテゴリ管理</button>
  </nav>

  <div id="tab-transactions" class="tab-panel active">

  <div class="period-nav">
    <select id="period-select">
      <option value="all" selected>全て</option>
      <option value="year">年</option>
      <option value="month">月</option>
      <option value="week">週</option>
    </select>
    <button id="prev-btn">&#8249;</button>
    <span id="period-label"></span>
    <button id="next-btn">&#8250;</button>
  </div>

  <div id="chart-section" class="chart-section">
    <div class="chart-toggle">
      <button class="chart-btn active" data-chart="bar">収入・支出</button>
      <button class="chart-btn" data-chart="net">収支差額</button>
      <button class="chart-btn" data-chart="balance">残高推移</button>
    </div>
    <div id="chart-container"></div>
  </div>

  <div id="summary-cards" class="summary-cards hidden">
    <div class="summary-card">
      <div class="summary-label">収入合計</div>
      <div class="summary-value deposit" id="summary-deposit">—</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">支出合計</div>
      <div class="summary-value withdrawal" id="summary-withdrawal">—</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">差引</div>
      <div class="summary-value net" id="summary-net">—</div>
    </div>
  </div>

  <div class="table-container">
    <div id="bank-panel">
      <table>
        <thead>
          <tr>
            <th>日付</th>
            <th class="col-amount text-right">引出し</th>
            <th class="col-amount text-right">預入れ</th>
            <th>内容</th>
            <th class="text-right">残高</th>
            <th>カテゴリ</th>
          </tr>
        </thead>
        <tbody id="bank-tbody"></tbody>
      </table>
    </div>
  </div>
  </div><!-- /tab-transactions -->

  <div id="tab-analytics" class="tab-panel hidden">
    <div class="analytics-header">
      <select id="analytics-month-select"></select>
    </div>
    <div class="analytics-grid">
      <div class="analytics-card">
        <h3>カテゴリ別支出（円グラフ）</h3>
        <div id="breakdown-chart" style="height:300px;"></div>
      </div>
      <div class="analytics-card">
        <h3>カテゴリ別推移（直近6ヶ月）</h3>
        <div id="trends-chart" style="height:300px;"></div>
      </div>
    </div>
    <div class="analytics-card" style="margin:0 16px 16px;">
      <h3>収支バランスシート</h3>
      <div id="balance-sheet-container"></div>
    </div>
    <div id="unclassified-warning" class="warning hidden"></div>
  </div>

  <div id="tab-categories" class="tab-panel hidden">
    <div class="category-grid">
      <div>
        <h3>カテゴリ</h3>
        <table id="categories-table">
          <thead><tr><th>名前</th><th>種別</th><th></th></tr></thead>
          <tbody id="categories-tbody"></tbody>
        </table>
        <form id="category-form" class="inline-form">
          <input type="text" id="cat-name-input" placeholder="カテゴリ名" required>
          <select id="cat-type-select">
            <option value="expense">支出</option>
            <option value="income">収入</option>
            <option value="exclude">除外</option>
          </select>
          <button type="submit" class="btn">追加</button>
        </form>
      </div>
      <div>
        <h3>キーワードルール</h3>
        <table id="rules-table">
          <thead><tr><th>キーワード</th><th>カテゴリ</th><th>対象</th><th></th></tr></thead>
          <tbody id="rules-tbody"></tbody>
        </table>
        <form id="rule-form" class="inline-form">
          <input type="text" id="rule-keyword-input" placeholder="キーワード" required>
          <select id="rule-category-select"></select>
          <select id="rule-target-select">
            <option value="both">両方</option>
            <option value="bank">銀行のみ</option>
            <option value="card">カードのみ</option>
          </select>
          <button type="submit" class="btn">追加</button>
        </form>
      </div>
    </div>

    <div class="ai-classify-section">
      <h3>AI自動分類</h3>
      <div class="ai-classify-controls">
        <button id="ai-suggest-btn" class="btn">未分類をAIで提案</button>
        <span id="ai-suggest-status" class="ai-status"></span>
      </div>
      <div id="ai-suggestions-container" class="hidden">
        <table id="ai-suggestions-table">
          <thead>
            <tr>
              <th>種別</th>
              <th>説明</th>
              <th>提案カテゴリ</th>
              <th>キーワード</th>
              <th>信頼度</th>
              <th>ルール化</th>
              <th>適用</th>
            </tr>
          </thead>
          <tbody id="ai-suggestions-tbody"></tbody>
        </table>
        <div class="ai-apply-controls">
          <button id="ai-apply-all-btn" class="btn">チェック済みを一括適用</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
